<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarKira - فلترة متقدمة</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">

  <header class="app-header">
    <div class="brand-small"><span class="dk-prefix">Dar</span><span class="dk-main">Kira</span></div>
    <div class="map-title-header"><span>فلترة متقدمة</span></div>
    <a href="home.html" class="close-modal" style="position:static; font-size:1.2rem;">✕</a>
  </header>

  <main class="main-content-scroll">
    <div class="form-card-container" style="max-width: 100%; border:none; background:transparent; padding:0;">
      
      <!-- نطاق السعر -->
      <div class="section-block">
        <h4 style="margin-bottom: 0.75rem; font-size: 0.95rem;">نطاق السعر (DA)</h4>
        <div style="display: flex; gap: 1rem;">
          <input type="text" value="36,000 DA" class="search-input" style="border-radius: var(--radius-sm); text-align: center;">
          <input type="text" value="80,000 DA" class="search-input" style="border-radius: var(--radius-sm); text-align: center;">
        </div>
      </div>

      <!-- نطاق التواريخ -->
      <div class="section-block">
        <h4 style="margin-bottom: 0.75rem; font-size: 0.95rem;">فترة الكراء</h4>
        <div style="display: flex; gap: 1rem;">
          <input type="date" value="2021-07-19" class="search-input" style="border-radius: var(--radius-sm);">
          <input type="date" value="2021-07-27" class="search-input" style="border-radius: var(--radius-sm);">
        </div>
      </div>

      <!-- الفلاتر والإضافات Filters -->
      <div class="section-block">
        <h4 style="margin-bottom: 0.75rem; font-size: 0.95rem;">المرافق والتسهيلات (Filters)</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <label class="remember-me"><input type="checkbox"> <span>Wifi</span></label>
          <label class="remember-me"><input type="checkbox"> <span>Parking</span></label>
          <label class="remember-me"><input type="checkbox"> <span>Balcony</span></label>
          <label class="remember-me"><input type="checkbox"> <span>Gas & Electricity</span></label>
        </div>
      </div>

      <!-- التسهيلات الأخرى Almenities -->
      <div class="section-block">
        <h4 style="margin-bottom: 0.75rem; font-size: 0.95rem;">Almenities</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <label class="remember-me"><input type="checkbox"> <span>حراسة أمنية</span></label>
          <label class="remember-me"><input type="checkbox"> <span>مصعد كهربائي</span></label>
        </div>
      </div>

      <button class="submit-btn" onclick="window.location.href='home.html'">تطبيق الفلترة (Send)</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
