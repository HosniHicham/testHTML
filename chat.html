<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarKira - الدردشة</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">

  <header class="app-header">
    <a href="property-details.html" style="color:var(--text-primary); text-decoration:none;">&larr;</a>
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" style="width: 32px; height: 32px; border-radius: 50%;">
      <span style="font-weight: 700; font-size: 0.9rem;">Amlne</span>
    </div>
    <div style="display: flex; gap: 15px;">
      <a href="tel:0550" style="color:var(--accent-teal); text-decoration:none;">📞</a>
      <a href="home.html" style="color:var(--text-secondary); text-decoration:none;">📹</a>
    </div>
  </header>

  <main class="main-content-scroll" style="display: flex; flex-direction: column; justify-content: flex-end; gap: 1rem;">
    <div style="text-align: center; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 1rem;">Today</div>

    <!-- رسالة مستلمة -->
    <div style="background: var(--bg-card); padding: 0.75rem 1rem; border-radius: var(--radius-sm); max-width: 80%; align-self: flex-start; font-size: 0.85rem; border: 1px solid var(--border-color);">
      مرحباً بك، هل الشقة ما زالت متاحة للكراء خلال هذه الفترة؟
    </div>

    <!-- رسالة مرسلة -->
    <div style="background: var(--accent-teal); color: white; padding: 0.75rem 1rem; border-radius: var(--radius-sm); max-width: 80%; align-self: flex-end; font-size: 0.85rem;">
      نعم أخي، الشقة متاحة ويمكننا إتمام الإجراءات عبر المنصة.
    </div>
  </main>

  <!-- شريط كتابة الرسالة -->
  <div style="position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); padding: 0.75rem 1rem; display: flex; gap: 0.5rem; border-top: 1px solid var(--border-color);">
    <input type="text" placeholder="Write a message..." class="search-input" style="flex: 1; border-radius: 20px;">
    <button class="primary-btn" style="padding: 0.5rem 1rem; border-radius: 20px;">Send</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
