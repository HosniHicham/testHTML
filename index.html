<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المدخل - المنصة العقارية</title>
  <link rel="stylesheet" href="style.css">
  <!-- خط تجريدي حديث ومناسب للواجهات البرمجية والعقارية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-container">
    <!-- خلفية جمالية مدمجة للتصميم الداكن -->
    <div class="glow-bg"></div>

    <div class="auth-card">
      <div class="brand-header">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <h2>مرحباً بك</h2>
        <p>قم بتسجيل الدخول وإدارة عقاراتك واستكشاف الفرص المتاحة</p>
      </div>

      <!-- تبويب التبديل بين الدخول وإنشاء حساب -->
      <div class="tab-buttons">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
        <button id="tab-register" class="tab-btn" onclick="switchTab('register')">حساب جديد</button>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <form id="login-form" class="auth-form active">
        <div class="input-group">
          <label for="login-email">البريد الإلكتروني</label>
          <input type="email" id="login-email" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>تذكرني</span>
          </label>
          <a href="#" class="forgot-pass">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="submit-btn">
          <span>دخول المنصة</span>
        </button>
      </form>

      <!-- نموذج إنشاء حساب جديد -->
      <form id="register-form" class="auth-form">
        <div class="input-group">
          <label for="reg-fullname">الاسم الكامل</label>
          <input type="text" id="reg-fullname" placeholder="أحمد محمد" required>
        </div>

        <div class="input-group">
          <label for="reg-email">البريد الإلكتروني</label>
          <input type="email" id="reg-email" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="reg-role">نوع الحساب</label>
          <select id="reg-role">
            <option value="user">باحث عن عقار / مستأجر</option>
            <option value="landlord">صاحب عقار / مؤجر</option>
            <option value="agent">وكيل عقاري</option>
          </select>
        </div>

        <div class="input-group">
          <label for="reg-password">كلمة المرور</label>
          <input type="password" id="reg-password" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" class="submit-btn">
          <span>إنشاء حساب جديد</span>
        </button>
      </form>

      <div class="footer-note">
        جميع الحقوق محفوظة &copy; 2026 المنصة العقارية
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
