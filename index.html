<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarKira الجزائر - شاشة الترحيب</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="splash-body">

  <div class="splash-container">
    <div class="glow-bg"></div>

    <div class="splash-card">
      <!-- الشعار وهوية التطبيق -->
      <div class="splash-brand">
        <div class="brand-logo-text">
          <span class="dk-prefix">Dar</span><span class="dk-main">Kira</span>
        </div>
        <h1 class="brand-title">الجزائر</h1>
        <p class="brand-tagline">Our Rental Home Algeria</p>
      </div>

      <!-- الرسم التوضيحي/أيقونة الهوية الجزائرية والمعمارية -->
      <div class="hero-illustration">
        <div class="monument-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
      </div>

      <!-- أزرار الإجراءات والانتقال -->
      <div class="action-box">
        <a href="home.html" class="primary-btn">
          <span>استكشاف العقارات مباشرة</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>

        <div class="auth-switch-box">
          <button class="secondary-btn" onclick="openAuthModal('login')">تسجيل الدخول</button>
          <button class="outline-btn" onclick="openAuthModal('register')">إنشاء حساب جديد</button>
        </div>
      </div>

      <div class="splash-footer">
        منصة مخصصة للكراء والسكن الموثق في الجزائر &copy; 2026
      </div>
    </div>
  </div>

  <!-- النافذة المنبثقة للتسجيل وتغيير الوضع دون مغادرة الصفحة -->
  <div id="auth-modal" class="modal-backdrop">
    <div class="modal-card">
      <button class="close-modal" onclick="closeAuthModal()">&times;</button>
      
      <div class="modal-tabs">
        <button id="tab-login" class="modal-tab active" onclick="toggleModalForm('login')">تسجيل الدخول</button>
        <button id="tab-register" class="modal-tab" onclick="toggleModalForm('register')">حساب جديد</button>
      </div>

      <!-- نموذج الدخول -->
      <form id="modal-login-form" class="modal-form active" onsubmit="event.preventDefault(); window.location.href='home.html';">
        <div class="input-group">
          <label>البريد الإلكتروني أو رقم الهاتف</label>
          <input type="text" placeholder="05XX XX XX XX" required>
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn">دخول</button>
      </form>

      <!-- نموذج إنشاء حساب -->
      <form id="modal-register-form" class="modal-form" onsubmit="event.preventDefault(); window.location.href='home.html';">
        <div class="input-group">
          <label>الاسم الكامل</label>
          <input type="text" placeholder="أحمد محمد" required>
        </div>
        <div class="input-group">
          <label>رقم الهاتف</label>
          <input type="tel" placeholder="05XX XX XX XX" required>
        </div>
        <div class="input-group">
          <label>نوع الحساب</label>
          <select>
            <option value="tenant">مستأجر / باحث عن سكن</option>
            <option value="landlord">مؤجر / صاحب عقار</option>
          </select>
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn">تأكيد الحساب</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
