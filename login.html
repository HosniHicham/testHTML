<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07182a">
  <title>تسجيل الدخول | عقار AQAR الجزائر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#07182a;
      --panel:#0d2238;
      --panel2:#112b43;
      --line:rgba(133,178,204,.18);
      --teal:#08b6ad;
      --teal2:#087f83;
      --text:#f4f8fc;
      --muted:#a8bacb;
      --white:#fff;
      --green:#12c982;
      --blue:#268df2;
      --shadow:0 14px 34px rgba(0,0,0,.26);
    }

    *{box-sizing:border-box}
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 35px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-mark {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 52px;
      line-height: 1;
      color: #18c5bd;
      text-shadow: 2px 2px 0 #dce9e9;
      font-weight: 900;
      display: inline-block;
      margin-bottom: 8px;
    }

    .auth-brand h1 {
      font-size: 20px;
      font-weight: 900;
      margin: 0;
    }

    .auth-brand p {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .form-group input {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 15px;
      border-radius: 12px;
      outline: none;
      transition: .2s;
    }

    .form-group input:focus {
      border-color: var(--teal);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 25px;
      color: var(--muted);
    }

    .form-options a {
      color: #42d8d0;
      font-weight: 700;
    }
    .form-options a:hover { text-decoration: underline; }

    .btn {
      border: 0;
      border-radius: 24px;
      padding: 12px 20px;
      font-weight: 800;
      transition: .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0cbeb3, #087f83);
      color: white;
      box-shadow: 0 7px 18px rgba(0, 167, 155, 0.3);
    }

    .btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .auth-footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    .auth-footer a {
      color: #42d8d0;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="auth-card">
    <div class="auth-brand">
      <a href="../index.html">
        <span class="brand-mark">AQ</span>
      </a>
      <h1>تسجيل الدخول إلى عقار</h1>
      <p>أدخل بيانات حسابك للمتابعة إلى المنصة</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="name@example.dz" required>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" style="accent-color:var(--teal)"> تذكرني
        </label>
        <a href="forgot-password.html">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" class="btn btn-primary">تسجيل الدخول 🚀</button>
    </form>

    <div class="auth-footer">
      ليس لديك حساب بعد؟ <a href="register.html">إنشاء حساب جديد</a>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      alert('تم تسجيل الدخول بنجاح! جاري تحويلك إلى لوحة التحكم...');
      window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
