<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07182a">
  <title>الخريطة العقارية التفاعلية | عقار AQAR الجزائر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --bg:#07182a;
      --panel:#0d2238;
      --panel2:#112b43;
      --line:rgba(133,178,204,.18);
      --teal:#08b6ad;
      --teal2:#087f83;
      --text:#f4f8fc;
      --muted:#a8bacb;
      --white:#fff;
      --green:#12c982;
      --blue:#268df2;
      --shadow:0 14px 34px rgba(0,0,0,.26);
    }

    *{box-sizing:border-box}
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Cairo", sans-serif; display: flex; flex-direction: column; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .topbar{
      height:76px; background:#061629; border-bottom:1px solid var(--line);
      display:flex; align-items:center; position:relative; z-index:20; flex-shrink: 0;
    }

    .container{width:min(1500px,94%);margin:auto; display: flex; align-items: center; justify-content: space-between; gap: 20px;}
    .brand{display:flex;align-items:center;gap:12px;min-width:210px}
    .brand-mark{
      font-family:Georgia,serif;font-style:italic;font-size:42px;
      line-height:1;color:#18c5bd;text-shadow:2px 2px 0 #dce9e9;
      font-weight:900
    }
    .brand-name{font-size:18px;font-weight:900;line-height:1.35}
    .brand-name small{
      display:block;color:var(--muted);font-size:10px;
      font-weight:500;direction:ltr;text-align:right;letter-spacing:1px
    }

    .nav-links{display:flex;align-items:center;gap:30px;color:#d5e1eb;font-size:14px}
    .nav-links a{padding:9px 0;transition:.2s}
    .nav-links a:hover, .nav-links a.active{color:#40d6ce}
    .nav-links a.active{border-bottom:2px solid var(--teal)}

    /* Map Layout */
    .map-page-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      height: calc(100vh - 76px);
      overflow: hidden;
    }

    .sidebar-list {
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--line);
      background: #061629;
    }

    .sidebar-header h2 { font-size: 16px; margin: 0 0 4px; font-weight: 900; }
    .sidebar-header p { font-size: 12px; color: var(--muted); margin: 0; }

    .properties-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .map-card {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .map-card:hover { border-color: var(--teal); transform: translateY(-2px); }

    .map-card img {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .map-card-info { flex: 1; min-width: 0; }
    .map-card-price { font-size: 15px; font-weight: 900; color: var(--teal); margin: 0 0 3px; }
    .map-card-title { font-size: 12px; font-weight: 800; margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .map-card-location { font-size: 11px; color: var(--muted); margin: 0; }

    #mapContainer {
      width: 100%;
      height: 100%;
    }

    @media(max-width: 950px) {
      .map-page-layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: auto; }
      #mapContainer { height: 400px; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="container">
    <a class="brand" href="../index.html">
      <span class="brand-mark">AQ</span>
      <span class="brand-name">عقار | AQAR<small>AQAR ALGERIA</small></span>
    </a>
    <nav class="nav-links">
      <a href="../index.html">الرئيسية</a>
      <a href="properties.html">العقارات</a>
      <a class="active" href="map.html">الخريطة</a>
    </nav>
  </div>
</header>

<div class="map-page-layout">
  <!-- Sidebar listing matched to map -->
  <aside class="sidebar-list">
    <div class="sidebar-header">
      <h2>العقارات المتاحة على الخريطة</h2>
      <p id="countInfo">جاري عرض العقارات...</p>
    </div>
    <div class="properties-scroll" id="mapCardsList">
      <!-- يتم تعبئتها ديناميكياً عبر الجافاسكريبت -->
    </div>
  </aside>

  <!-- Interactive Leaflet Map -->
  <main id="mapContainer" aria-label="خريطة العقارات"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // بيانات العقارات التجريبية مع الإحداثيات الجغرافية في الجزائر
  const properties = [
    { id:1, type:"فيلا", category:"سكني", deal:"للبيع", price:"45,000,000 دج", title:"فيلا فاخرة في الجزائر العاصمة", city:"الجزائر العاصمة", lat:36.7538, lng:3.0588, image:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=85" },
    { id:2, type:"شقة", category:"سكني", deal:"للإيجار", price:"70,000 دج / شهر", title:"شقة F4 للإيجار في وهران", city:"وهران", lat:35.6971, lng:-0.6308, image:"https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=600&q=85" },
    { id:3, type:"أرض سكنية", category:"فلاحي", deal:"للبيع", price:"8,500,000 دج", title:"أرض للبناء في البليدة", city:"البليدة", lat:36.4700, lng:2.8300, image:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=85" },
    { id:4, type:"محل تجاري", category:"تجاري", deal:"للبيع", price:"16,000,000 دج", title:"محل تجاري بموقع حيوي", city:"قسنطينة", lat:36.3650, lng:6.6147, image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=85" },
    { id:5, type:"شقة", category:"سكني", deal:"للبيع", price:"13,500,000 دج", title:"شقة عائلية بإطلالة جميلة", city:"سطيف", lat:36.1900, lng:5.4100, image:"https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=600&q=85" },
    { id:6, type:"مكتب", category:"تجاري", deal:"للإيجار", price:"55,000 دج / شهر", title:"مكتب إداري مجهز", city:"تيبازة", lat:36.5890, lng:2.4480, image:"https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=600&q=85" },
    { id:7, type:"مستودع", category:"صناعي", deal:"للإيجار", price:"180,000 دج / شهر", title:"مستودع صناعي بمساحة واسعة", city:"وهران", lat:35.7100, lng:-0.6200, image:"https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=85" }
  ];

  const map = L.map("mapContainer").setView([36.5, 3.0], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const listContainer = document.getElementById("mapCardsList");
  document.getElementById("countInfo").textContent = `${properties.length} عقار متوفر على الخريطة`;

  properties.forEach(p => {
    // بناء القائمة الجانبية
    const card = document.createElement("div");
    card.className = "map-card";
    card.innerHTML = `
      <img src="${p.image}" alt="${p.title}">
      <div class="map-card-info">
        <p class="map-card-price">${p.price}</p>
        <div class="map-card-title">${p.title}</div>
        <p class="map-card-location">📍 ${p.city} • ${p.deal}</p>
      </div>
    `;

    card.addEventListener("click", () => {
      map.setView([p.lat, p.lng], 13, {animate: true});
    });
    listContainer.appendChild(card);

    // إضافة العلامة على الخريطة
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 9,
      color: "#fff",
      weight: 2,
      fillColor: "#08b6ad",
      fillOpacity: 1
    }).addTo(map);

    marker.bindPopup(`
      <div style="font-family:'Cairo',sans-serif; text-align:right;">
        <strong style="color:#087c7c;">${p.title}</strong><br>
        <span style="font-weight:bold;">${p.price}</span><br>
        <small>📍 ${p.city}</small><br>
        <a href="property-details.html" style="color:#08b6ad; font-weight:bold; display:inline-block; margin-top:5px;">التفاصيل ←</a>
      </div>
    `);
  });
</script>

</body>
</html>
