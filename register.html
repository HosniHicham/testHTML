<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07182a">
  <title>إنشاء حساب جديد | عقار AQAR الجزائر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#07182a;
      --panel:#0d2238;
      --panel2:#112b43;
      --line:rgba(133,178,204,.18);
      --teal:#08b6ad;
      --teal2:#087f83;
      --text:#f4f8fc;
      --muted:#a8bacb;
      --white:#fff;
      --green:#12c982;
      --blue:#268df2;
      --shadow:0 14px 34px rgba(0,0,0,.26);
    }

    *{box-sizing:border-box}
    html, body { min-height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 35px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-mark {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 52px;
      line-height: 1;
      color: #18c5bd;
      text-shadow: 2px 2px 0 #dce9e9;
      font-weight: 900;
      display: inline-block;
      margin-bottom: 8px;
    }

    .auth-brand h1 {
      font-size: 20px;
      font-weight: 900;
      margin: 0;
    }

    .auth-brand p {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .form-group input, .form-group select {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 15px;
      border-radius: 12px;
      outline: none;
      transition: .2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--teal);
    }

    .terms-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .terms-check a {
      color: #42d8d0;
      font-weight: 700;
    }

    .btn {
      border: 0;
      border-radius: 24px;
      padding: 12px 20px;
      font-weight: 800;
      transition: .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0cbeb3, #087f83);
      color: white;
      box-shadow: 0 7px 18px rgba(0, 167, 155, 0.3);
    }

    .btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .auth-footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    .auth-footer a {
      color: #42d8d0;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="auth-card">
    <div class="auth-brand">
      <a href="../index.html">
        <span class="brand-mark">AQ</span>
      </a>
      <h1>إنشاء حساب جديد في عقار</h1>
      <p>انضم إلينا واستمتع بتجربة عقارية متكاملة في الجزائر</p>
    </div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="regName" placeholder="مثال: هشام حسني" required>
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="regEmail" placeholder="name@example.dz" required>
      </div>

      <div class="form-group">
        <label>رقم الهاتف النقال</label>
        <input type="tel" id="regPhone" placeholder="+213 550 00 00 00" required>
      </div>

      <div class="form-group">
        <label>نوع الحساب</label>
        <select id="regRole">
          <option value="user">محث / مطلع (البحث عن عقار)</option>
          <option value="owner">مالك عقار (نشر عقارات شخصية)</option>
          <option value="agency">وكالة عقارية معتمدة</option>
        </select>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="regPassword" placeholder="••••••••" required>
      </div>

      <div class="terms-check">
        <input type="checkbox" id="terms" style="accent-color:var(--teal)" required>
        <label for="terms">أوافق على <a href="#">شروط الاستخدام</a> و<a href="#">سياسة الخصوصية</a> الخاصة بمنصة عقار.</label>
      </div>

      <button type="submit" class="btn btn-primary">إنشاء الحساب 🚀</button>
    </form>

    <div class="auth-footer">
      لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>
  </div>

  <script>
    function handleRegister(event) {
      event.preventDefault();
      alert('تم إنشاء الحساب بنجاح! مرحباً بك في منصة عقار الجزائر.');
      window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
