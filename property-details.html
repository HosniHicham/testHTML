<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarKira - تفاصيل السكن</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">

  <header class="app-header">
    <a href="home.html" style="color:var(--text-primary); text-decoration:none;">&larr; رجوع</a>
    <div class="map-title-header"><span>تفاصيل السكن</span></div>
    <div style="display: flex; gap: 10px;">
      <button style="background:transparent; border:none; color:var(--text-primary); cursor:pointer;">🤍</button>
      <button style="background:transparent; border:none; color:var(--text-primary); cursor:pointer;">🔗</button>
    </div>
  </header>

  <main class="main-content-scroll">
    
    <!-- معرض الصور -->
    <div class="grid-img" style="height: 220px; border-radius: var(--radius-sm); margin-bottom: 1rem; display:flex; align-items:center; justify-content:center; color:var(--text-secondary);">
      <span>معرض صور العقار (Gallery)</span>
      <span class="badge badge-teal">Verified by Darkira</span>
    </div>

    <!-- معلومات العقار الرئيسية -->
    <div class="form-card-container" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 1rem;">
      <h2 style="font-size: 1.2rem; margin-bottom: 0.25rem;">Hydra, Allger</h2>
      <p style="color: var(--accent-blue); font-weight: 800; font-size: 1.1rem; margin-bottom: 0.75rem;">80,000 DA <span style="font-size: 0.75rem; color:var(--text-secondary);">/month</span></p>
      
      <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 0.75rem 0; margin-bottom: 0.75rem;">
        <span>🛏️ 1 hiyam</span>
        <span>📐 120eqm</span>
        <span>✨ 2 teayens</span>
      </div>

      <p style="font-size: 0.85rem; color: var(--text-secondary);">شقة مجهزة بالكامل وموثقة رسمياً من طرف نظام داركيرة لضمان حقوق المالك والمستأجر.</p>
    </div>

    <!-- معلومات المضيف Host Profile -->
    <div class="form-card-container" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 1rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover;">
        <div>
          <h4 style="font-size: 0.95rem;">Host Profile</h4>
          <p style="font-size: 0.75rem; color: var(--text-secondary);">⭐ 4.5 • موثق معتمد</p>
        </div>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <a href="chat.html" class="filter-pill" style="background:var(--accent-teal); color:white; border:none; padding: 0.5rem 0.75rem; text-decoration:none;">Contact Host</a>
        <a href="tel:0550000000" class="filter-pill" style="background:var(--accent-blue); color:#0F172A; border:none; padding: 0.5rem 0.75rem; text-decoration:none; font-weight:700;">Call</a>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
